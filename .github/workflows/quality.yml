# Educational quality gates only.
# Read-only. No publication, no live trading, no CI secrets, no write permissions.
name: Quality

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: compile, lint, tests, secrets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install quality extras
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Syntax compile
        run: python -m compileall -q -x '(.venv|venv|__pycache__|\.git)' .

      - name: Lint
        run: ruff check src tests scripts

      - name: Tests
        run: python -m pytest tests/ -q

      - name: Secret scan
        run: python scripts/security/check_secrets.py

      - name: Internal markdown links
        run: python scripts/quality/check.py links
